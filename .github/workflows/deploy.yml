name: Deploy

# main → build & push images → staging (migrate + smoke) → manual approval → production
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write # OIDC to your cloud — no long-lived keys
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    strategy:
      matrix: { component: [backend, frontend] }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with: { registry: "${{ env.REGISTRY }}", username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          sbom: true
          provenance: mode=max
      - name: Scan image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}:${{ steps.meta.outputs.tag }}
          severity: HIGH,CRITICAL
          exit-code: "1"

  staging:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: staging, url: "${{ vars.STAGING_URL }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # TODO(platform): replace with your target — e.g. AWS ECS/EKS, GCP Cloud Run, Azure Container Apps, Fly.io.
      # 1) authenticate via OIDC  2) run `alembic upgrade head` as a one-off task (expand-only migrations)
      # 3) roll out the new image tag  4) wait for health checks
      - name: Deploy to staging
        run: echo "Deploy ${{ needs.build.outputs.tag }} to staging (configure for your platform)"
      - uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
      - name: Smoke test staging
        if: vars.STAGING_URL != ''
        env: { BASE_URL: "${{ vars.STAGING_API_URL }}", TOKEN: "${{ secrets.STAGING_SMOKE_TOKEN }}" }
        run: k6 run perf/k6/smoke.js

  production:
    needs: [build, staging]
    runs-on: ubuntu-latest
    environment: { name: production, url: "${{ vars.PRODUCTION_URL }}" } # add required reviewers in repo settings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Deploy to production
        run: echo "Deploy ${{ needs.build.outputs.tag }} to production (configure for your platform)"
      - uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
      - name: Smoke test production (roll back on failure)
        if: vars.PRODUCTION_URL != ''
        env: { BASE_URL: "${{ vars.PRODUCTION_API_URL }}", TOKEN: "${{ secrets.PROD_SMOKE_TOKEN }}" }
        run: k6 run perf/k6/smoke.js
