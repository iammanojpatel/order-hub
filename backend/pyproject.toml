[project]
name = "app"
version = "0.1.0"
description = "Backend service — layered DDD / hexagonal / event-driven (FastAPI + MySQL)"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.30",
  "pymysql>=1.1",
  "cryptography>=43",
  "alembic>=1.13",
  "pyjwt>=2.9",
  "structlog>=24.4",
  "asyncmy>=0.2.16",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "pytest-xdist>=3.6",
  "httpx>=0.27",
  "testcontainers[mysql]>=4.8",
  "schemathesis>=3.36",
  "mypy>=1.11",
  "ruff>=0.6",
  "import-linter>=2.1",
  "pip-audit>=2.7",
  "mutmut>=3.0",
  "py-spy>=0.3.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

# ── Ruff: lint + format ─────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "S", "C4", "SIM", "RET", "ARG", "PTH", "PL", "RUF", "ASYNC", "DTZ", "T20", "PT", "TID"]
ignore = ["PLR0913", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "PLR2004", "ARG001"]
"migrations/**" = ["N999"]
"src/app/*/api/**" = ["PLR0917"]  # FastAPI injects dependencies as parameters

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# ── Mypy: strict typing ─────────────────────────────────────────────
[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["app"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "asyncmy.*"]
ignore_missing_imports = true

# ── Pytest ──────────────────────────────────────────────────────────
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers"
markers = [
  "integration: needs Docker (Testcontainers MySQL)",
  "contract: OpenAPI contract tests",
]

[tool.coverage.run]
source = ["src/app"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.mutmut]
paths_to_mutate = ["src/app/catalog/domain/"]
tests_dir = ["tests/unit/"]

# ── Architecture fitness functions (import-linter) ──────────────────
[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain layer is pure (no frameworks, no outer layers)"
type = "forbidden"
source_modules = ["app.catalog.domain", "app.shared.domain"]
forbidden_modules = ["fastapi", "sqlalchemy", "pydantic", "app.catalog.application", "app.catalog.infrastructure", "app.catalog.api", "app.shared.infrastructure", "app.shared.api"]

[[tool.importlinter.contracts]]
name = "Application layer does not depend on adapters"
type = "forbidden"
source_modules = ["app.catalog.application", "app.shared.application"]
forbidden_modules = ["fastapi", "sqlalchemy", "app.catalog.infrastructure", "app.catalog.api", "app.shared.api"]

[[tool.importlinter.contracts]]
name = "Hexagonal layering"
type = "layers"
layers = ["app.catalog.api", "app.catalog.infrastructure", "app.catalog.application", "app.catalog.domain"]
