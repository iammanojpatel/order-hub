# Local stack. `make up` starts MySQL; `make up-all` also runs API + web in containers.
name: app

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --slow-query-log=ON
      - --long-query-time=0.2          # log queries slower than 200 ms (perf work)
      - --log-queries-not-using-indexes=ON
    ports: ["3306:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    profiles: ["full"]
    build: ./backend
    environment:
      APP_ENV: local
      APP_DATABASE_URL: mysql+asyncmy://app:app@mysql:3306/app
    ports: ["8000:8000"]
    depends_on:
      mysql: { condition: service_healthy }
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  web:
    profiles: ["full"]
    build: ./frontend
    environment:
      API_BASE_URL: http://api:8000
      API_TOKEN: ${API_TOKEN:-}
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  mysql-data:
